    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'TipoBrasilRounded', 'Open Sans', sans-serif;
        background-color: #0c1a3d;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .logo-wrapper {
        margin-bottom: 2.5rem;
      }

      .logo-wrapper svg {
        width: 280px;
        height: auto;
      }

      .card {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 8px 40px rgba(30, 51, 148, 0.10), 0 2px 8px rgba(30, 51, 148, 0.06);
        padding: 3rem 3.5rem;
        text-align: center;
        max-width: 460px;
        width: 100%;
      }

      .illustration {
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
      }

      @keyframes spin-slow {
        0%, 62% { transform: rotate(0deg); }
        100%    { transform: rotate(360deg); }
      }

      .spin-ring {
        transform-origin: 50px 50px;
        animation: spin-slow 13s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      h1 {
        font-size: 1.5rem;
        color: #1E3394;
        font-weight: 700;
        margin-bottom: 1rem;
        line-height: 1.3;
      }

      p {
        font-size: 1rem;
        color: #5a6580;
        line-height: 1.3;
      }

      .badge {
        display: inline-block;
        background: #D7EB2F;
        color: #0c1a3d;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 20px;
        padding: 0.3rem 0.9rem;
        margin-bottom: 1.25rem;
      }

      @media (max-width: 480px) {
        .card { padding: 2rem 1.5rem; }
        h1 { font-size: 1.25rem; }
      }
    </style>
